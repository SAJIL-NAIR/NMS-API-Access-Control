services:

  mock-nms:
    build:
      context: ./mock-nms

    container_name: mock-nms

    restart: unless-stopped

    expose:
      - "8000"

    networks:
      - nms-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4

    container_name: keycloak

    restart: unless-stopped

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    ports:
      - "8080:8080"

    volumes:
      - ./keycloak/nms-realm-realm.json:/opt/keycloak/data/import/nms-realm-realm.json:ro

    networks:
      - nms-network


  kong:
    build:
      context: ./kong

    image: secure-nms-kong:3.9.3

    container_name: kong

    restart: unless-stopped

    depends_on:
      - mock-nms
      - keycloak

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-nms-realm}

      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr

      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      KONG_ADMIN_LISTEN: 0.0.0.0:8001

    ports:
      - "8000:8000"
      - "8001:8001"

    volumes:
      - ./kong/kong.yml:/kong/config/kong.yml:ro

    networks:
      - nms-network


networks:

  nms-network:
    driver: bridge