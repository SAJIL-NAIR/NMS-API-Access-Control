_format_version: "3.0"

_transform: true


services:

  - name: mock-nms-service
    url: http://mock-nms:8000

    routes:

      - name: nms-api-route
        paths:
          - /nms
        protocols:
          - http


consumers:

  - username: nms-client

    jwt_secrets:

      - key: nms-client
        algorithm: RS256
        secret: "demo-secret-not-used-for-rs256"

        rsa_public_key: |
          __KEYCLOAK_RSA_PUBLIC_KEY__


plugins:

  - name: jwt
    route: nms-api-route

    config:
      header_names:
        - authorization

      key_claim_name: azp

      claims_to_verify:
        - exp


  - name: rate-limiting
    route: nms-api-route

    config:
      minute: 30
      policy: local
      limit_by: ip